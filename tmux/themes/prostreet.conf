# Prostreet: tmux status and pane theme inspired by the NFS ProStreet graffiti wallpapers.
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#161819,fg=#d9dbd6"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#161819,bg=#b8f02c,bold] #S #[fg=#b8f02c,bg=#161819] "
set -g window-status-format "#[fg=#92989b,bg=#161819] #I:#W "
set -g window-status-current-format "#[fg=#f4f5f0,bg=#1d1f21,bold] #I:#W #[fg=#b8f02c]*"
set -g window-status-separator ""
set -g status-right "#[fg=#92989b]%Y-%m-%d #[fg=#383c3f]│ #[fg=#b8f02c]%H:%M "

set -g pane-border-style "fg=#383c3f"
set -g pane-active-border-style "fg=#b8f02c"
set -g message-style "bg=#1d1f21,fg=#f4f5f0,bold"
set -g message-command-style "bg=#1d1f21,fg=#f4f5f0,bold"
setw -g mode-style "bg=#30353a,fg=#d4ff55"
setw -g clock-mode-colour "#b8f02c"
